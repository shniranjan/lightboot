services:
  lightboot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: lightboot:latest
    container_name: lightboot
    ports:
      - "8080:8080/tcp"   # Web UI + boot files
      - "69:69/udp"        # TFTP
      - "67:67/udp"        # DHCP proxy
    volumes:
      - ./iso:/app/iso:rw
      - ./data:/app/data:rw
      - ./cache:/app/cache:rw
      - ./config.yaml:/app/config.yaml:ro   # optional, overrides env
    environment:
      - LIGHTBOOT_API_TOKEN=${LIGHTBOOT_API_TOKEN:-}
      - LIGHTBOOT_HTTP_PORT=8080
      - LIGHTBOOT_HTTP_ADDRESS=0.0.0.0
      - LIGHTBOOT_TFTP_PORT=69
      - LIGHTBOOT_LOG_LEVEL=info
    restart: unless-stopped
    # DHCP proxy requires NET_RAW capability
    cap_add:
      - NET_RAW
      - NET_BIND_SERVICE
    # Or use network_mode: host to avoid port conflicts with DHCP/TFTP
    # network_mode: host
